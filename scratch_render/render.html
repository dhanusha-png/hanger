<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product 3D Studio Renderer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1000px;
      height: 1000px;
      overflow: hidden;
      background: #f7f6f2;
    }
    #canvas-container {
      width: 1000px;
      height: 1000px;
      position: relative;
    }
    canvas {
      width: 1000px !important;
      height: 1000px !important;
      display: block;
    }
  </style>
  <script src="three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id') || 'hanger_1';

    const width = 1000;
    const height = 1000;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf6f5f0);

    const camera = new THREE.PerspectiveCamera(38, width / height, 0.1, 100);
    camera.position.set(0, 3.2, 7.8);
    camera.lookAt(0, 0.9, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Studio Lighting
    const ambientLight = new THREE.AmbientLight(0xfffaf0, 0.7);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xfff8ee, 1.35);
    keyLight.position.set(4, 8, 6);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 25;
    keyLight.shadow.camera.left = -5;
    keyLight.shadow.camera.right = 5;
    keyLight.shadow.camera.top = 5;
    keyLight.shadow.camera.bottom = -5;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xebf2fa, 0.85);
    fillLight.position.set(-5, 4, 3);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 0.9);
    rimLight.position.set(0, 6, -6);
    scene.add(rimLight);

    const bottomBounce = new THREE.DirectionalLight(0xf0ede6, 0.3);
    bottomBounce.position.set(0, -3, 2);
    scene.add(bottomBounce);

    // Seamless Cyclorama Studio Floor
    const floorGeo = new THREE.PlaneGeometry(30, 30);
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0xf5f3ec,
      roughness: 0.85,
      metalness: 0.05
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.01;
    floor.receiveShadow = true;
    scene.add(floor);

    // Common Materials
    const chromeMat = new THREE.MeshStandardMaterial({
      color: 0xeef1f5,
      metalness: 0.92,
      roughness: 0.15
    });

    const brushedSteelMat = new THREE.MeshStandardMaterial({
      color: 0xd6dbdf,
      metalness: 0.85,
      roughness: 0.3
    });

    const matteBlackMat = new THREE.MeshStandardMaterial({
      color: 0x242628,
      metalness: 0.3,
      roughness: 0.45
    });

    const oakWoodMat = new THREE.MeshStandardMaterial({
      color: 0xbfa072,
      metalness: 0.05,
      roughness: 0.65
    });

    const darkWalnutMat = new THREE.MeshStandardMaterial({
      color: 0x483222,
      metalness: 0.05,
      roughness: 0.55
    });

    const champagneGoldMat = new THREE.MeshStandardMaterial({
      color: 0xd9b360,
      metalness: 0.88,
      roughness: 0.22
    });

    const whitePowderMat = new THREE.MeshStandardMaterial({
      color: 0xf4f4f4,
      metalness: 0.15,
      roughness: 0.35
    });

    const rubberMat = new THREE.MeshStandardMaterial({
      color: 0x181818,
      roughness: 0.85
    });

    const brassMat = new THREE.MeshStandardMaterial({
      color: 0xcc9933,
      metalness: 0.9,
      roughness: 0.2
    });

    const productGroup = new THREE.Group();
    scene.add(productGroup);

    // Helper functions
    function addCylinder(group, rTop, rBot, height, mat, pos, rot) {
      const geo = new THREE.CylinderGeometry(rTop, rBot, height, 24);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      if (pos) mesh.position.set(pos[0], pos[1], pos[2]);
      if (rot) mesh.rotation.set(rot[0], rot[1], rot[2]);
      group.add(mesh);
      return mesh;
    }

    function addBox(group, w, h, d, mat, pos, rot) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      if (pos) mesh.position.set(pos[0], pos[1], pos[2]);
      if (rot) mesh.rotation.set(rot[0], rot[1], rot[2]);
      group.add(mesh);
      return mesh;
    }

    // PRODUCT BUILDERS
    if (productId === 'hanger_1') {
      // 1. Premium Wall Mounted Clothes Drying Hanger (Accordion scissor style)
      camera.position.set(0, 2.5, 6.2);
      camera.lookAt(0, 1.2, 0);

      // Back wall panel
      addBox(productGroup, 3.8, 2.8, 0.08, whitePowderMat, [0, 1.4, -1.2]);

      // Wall mounting brackets
      addBox(productGroup, 0.12, 1.0, 0.15, matteBlackMat, [-1.3, 1.4, -1.1]);
      addBox(productGroup, 0.12, 1.0, 0.15, matteBlackMat, [1.3, 1.4, -1.1]);

      // Scissor accordion arms (left & right)
      const segments = 3;
      const reach = 0.55;
      for (let side of [-1.3, 1.3]) {
        for (let i = 0; i < segments; i++) {
          const z1 = -1.1 + i * reach;
          const z2 = -1.1 + (i + 1) * reach;
          const midZ = (z1 + z2) / 2;
          // Scissor bar A
          addBox(productGroup, 0.04, 0.08, reach * 1.3, matteBlackMat, [side, 1.55 - (i % 2) * 0.15, midZ], [0.35 * (i % 2 ? -1 : 1), 0, 0]);
          // Scissor bar B
          addBox(productGroup, 0.04, 0.08, reach * 1.3, matteBlackMat, [side, 1.25 + (i % 2) * 0.15, midZ], [-0.35 * (i % 2 ? -1 : 1), 0, 0]);
        }
      }

      // 6 Parallel Stainless Steel drying rods
      for (let i = 0; i < 6; i++) {
        const z = -1.0 + i * 0.28;
        const y = 1.4 + Math.sin(i * 0.5) * 0.06;
        addCylinder(productGroup, 0.022, 0.022, 2.65, chromeMat, [0, y, z], [0, 0, Math.PI / 2]);
        // Chrome end caps
        addCylinder(productGroup, 0.03, 0.03, 0.04, brushedSteelMat, [-1.33, y, z], [0, 0, Math.PI / 2]);
        addCylinder(productGroup, 0.03, 0.03, 0.04, brushedSteelMat, [1.33, y, z], [0, 0, Math.PI / 2]);
      }
    }
    else if (productId === 'hanger_2') {
      // 2. Multi-Tier Folding Clothes Drying Rack (Gullwing A-frame)
      camera.position.set(0, 2.8, 6.8);
      camera.lookAt(0, 1.2, 0);

      // Central A-frame legs
      for (let side of [-1.1, 1.1]) {
        addCylinder(productGroup, 0.03, 0.03, 2.1, matteBlackMat, [side, 1.0, -0.4], [0.3, 0, 0]);
        addCylinder(productGroup, 0.03, 0.03, 2.1, matteBlackMat, [side, 1.0, 0.4], [-0.3, 0, 0]);
        // Rubber feet
        addCylinder(productGroup, 0.04, 0.04, 0.08, rubberMat, [side, 0.04, -0.68], [0, 0, 0]);
        addCylinder(productGroup, 0.04, 0.04, 0.08, rubberMat, [side, 0.04, 0.68], [0, 0, 0]);
        // Cross brace
        addCylinder(productGroup, 0.02, 0.02, 0.8, brushedSteelMat, [side, 0.5, 0], [Math.PI / 2, 0, 0]);
      }

      // Central flat drying table
      for (let r = 0; r < 7; r++) {
        addCylinder(productGroup, 0.012, 0.012, 2.2, chromeMat, [0, 1.45, -0.35 + r * 0.12], [0, 0, Math.PI / 2]);
      }
      // Main center perimeter frame
      addBox(productGroup, 2.25, 0.04, 0.04, matteBlackMat, [0, 1.45, -0.4]);
      addBox(productGroup, 2.25, 0.04, 0.04, matteBlackMat, [0, 1.45, 0.4]);

      // Left angled wing (folded upward at 25 deg)
      const leftWing = new THREE.Group();
      leftWing.position.set(-1.1, 1.45, 0);
      leftWing.rotation.z = 0.4;
      for (let r = 0; r < 6; r++) {
        addCylinder(leftWing, 0.012, 0.012, 0.9, chromeMat, [-0.45, 0, -0.32 + r * 0.13], [0, 0, Math.PI / 2]);
      }
      addBox(leftWing, 0.95, 0.03, 0.72, matteBlackMat, [-0.48, 0, 0]);
      productGroup.add(leftWing);

      // Right angled wing
      const rightWing = new THREE.Group();
      rightWing.position.set(1.1, 1.45, 0);
      rightWing.rotation.z = -0.4;
      for (let r = 0; r < 6; r++) {
        addCylinder(rightWing, 0.012, 0.012, 0.9, chromeMat, [0.45, 0, -0.32 + r * 0.13], [0, 0, Math.PI / 2]);
      }
      addBox(rightWing, 0.95, 0.03, 0.72, matteBlackMat, [0.48, 0, 0]);
      productGroup.add(rightWing);

      // Lower shoe/towel shelf
      for (let r = 0; r < 4; r++) {
        addCylinder(productGroup, 0.012, 0.012, 2.1, chromeMat, [0, 0.38, -0.2 + r * 0.13], [0, 0, Math.PI / 2]);
      }
    }
    else if (productId === 'hanger_3') {
      // 3. Heavy Duty Garment Hanger Rack (Industrial rolling rack)
      camera.position.set(0, 2.6, 6.2);
      camera.lookAt(0, 1.3, 0);

      // Heavy bottom H-frame base
      addBox(productGroup, 0.06, 0.06, 1.2, matteBlackMat, [-1.2, 0.15, 0]);
      addBox(productGroup, 0.06, 0.06, 1.2, matteBlackMat, [1.2, 0.15, 0]);
      addBox(productGroup, 2.4, 0.06, 0.06, matteBlackMat, [0, 0.15, 0]);

      // 4 heavy duty casters
      for (let x of [-1.2, 1.2]) {
        for (let z of [-0.5, 0.5]) {
          addCylinder(productGroup, 0.05, 0.05, 0.04, rubberMat, [x, 0.06, z], [0, 0, Math.PI / 2]);
          addBox(productGroup, 0.06, 0.08, 0.06, brushedSteelMat, [x, 0.1, z]);
        }
      }

      // Vertical heavy round posts
      addCylinder(productGroup, 0.04, 0.04, 2.2, matteBlackMat, [-1.2, 1.25, 0]);
      addCylinder(productGroup, 0.04, 0.04, 2.2, matteBlackMat, [1.2, 1.25, 0]);

      // Heavy Duty Top Hanging Bar with extenders
      addCylinder(productGroup, 0.035, 0.035, 2.8, chromeMat, [0, 2.35, 0], [0, 0, Math.PI / 2]);
      // End stoppers
      addCylinder(productGroup, 0.05, 0.05, 0.06, chromeMat, [-1.4, 2.35, 0], [0, 0, Math.PI / 2]);
      addCylinder(productGroup, 0.05, 0.05, 0.06, chromeMat, [1.4, 2.35, 0], [0, 0, Math.PI / 2]);

      // Bottom grid shelf for bags/boxes
      for (let i = 0; i < 6; i++) {
        addCylinder(productGroup, 0.012, 0.012, 2.35, brushedSteelMat, [0, 0.22, -0.35 + i * 0.14], [0, 0, Math.PI / 2]);
      }

      // 4 stylish hanging hangers on the top bar
      for (let h = 0; h < 4; h++) {
        const hx = -0.6 + h * 0.4;
        addCylinder(productGroup, 0.008, 0.008, 0.12, chromeMat, [hx, 2.29, 0]);
        addBox(productGroup, 0.42, 0.02, 0.03, oakWoodMat, [hx, 2.23, 0]);
      }
    }
    else if (productId === 'hanger_4') {
      // 4. Compact Balcony Drying Hanger (Railing hook-on rack)
      camera.position.set(0, 2.2, 5.8);
      camera.lookAt(0, 1.2, 0);

      // Balcony railing simulation in background
      addBox(productGroup, 3.4, 0.08, 0.1, matteBlackMat, [0, 1.6, -0.6]);
      for (let b = 0; b < 9; b++) {
        addCylinder(productGroup, 0.02, 0.02, 1.2, matteBlackMat, [-1.4 + b * 0.35, 1.0, -0.6]);
      }

      // 2 curved adjustable hanging arms hooking over the rail
      for (let side of [-0.9, 0.9]) {
        // Hook over rail
        addBox(productGroup, 0.05, 0.05, 0.3, champagneGoldMat, [side, 1.65, -0.5]);
        addBox(productGroup, 0.05, 0.2, 0.05, champagneGoldMat, [side, 1.55, -0.66]);
        // Extension arm
        addBox(productGroup, 0.05, 0.05, 0.75, champagneGoldMat, [side, 1.55, -0.15], [0.15, 0, 0]);
      }

      // Horizontal drying frame
      addBox(productGroup, 1.9, 0.04, 0.04, matteBlackMat, [0, 1.48, -0.3]);
      addBox(productGroup, 1.9, 0.04, 0.04, matteBlackMat, [0, 1.38, 0.4]);
      addBox(productGroup, 0.04, 0.04, 0.72, matteBlackMat, [-0.93, 1.43, 0.05]);
      addBox(productGroup, 0.04, 0.04, 0.72, matteBlackMat, [0.93, 1.43, 0.05]);

      // 6 parallel aluminum drying bars
      for (let r = 0; r < 6; r++) {
        addCylinder(productGroup, 0.014, 0.014, 1.82, brushedSteelMat, [0, 1.43 - r * 0.015, -0.25 + r * 0.11], [0, 0, Math.PI / 2]);
      }
    }
    else if (productId === 'hanger_5') {
      // 5. Adjustable Clothes Drying Rack (Telescopic dual height poles)
      camera.position.set(0, 2.7, 6.4);
      camera.lookAt(0, 1.3, 0);

      // Wide heavy base with stabilizing feet
      for (let side of [-1.1, 1.1]) {
        addBox(productGroup, 0.08, 0.08, 0.9, matteBlackMat, [side, 0.1, 0]);
        addCylinder(productGroup, 0.04, 0.04, 0.06, rubberMat, [side, 0.04, -0.4]);
        addCylinder(productGroup, 0.04, 0.04, 0.06, rubberMat, [side, 0.04, 0.4]);
      }
      addCylinder(productGroup, 0.025, 0.025, 2.2, matteBlackMat, [0, 0.15, -0.2], [0, 0, Math.PI / 2]);
      addCylinder(productGroup, 0.025, 0.025, 2.2, matteBlackMat, [0, 0.15, 0.2], [0, 0, Math.PI / 2]);

      // Dual upright lower outer tubes
      for (let side of [-1.1, 1.1]) {
        addCylinder(productGroup, 0.04, 0.04, 1.3, matteBlackMat, [side, 0.75, 0]);
        // Quick release adjustment collar
        addCylinder(productGroup, 0.05, 0.05, 0.08, champagneGoldMat, [side, 1.4, 0]);
        // Upper telescopic inner chrome tubes
        addCylinder(productGroup, 0.03, 0.03, 1.1, chromeMat, [side, 1.9, 0]);
      }

      // Top main hanging bar
      addCylinder(productGroup, 0.032, 0.032, 2.6, chromeMat, [0, 2.45, 0], [0, 0, Math.PI / 2]);
      // Mid-level adjustable hanging bar
      addCylinder(productGroup, 0.028, 0.028, 2.3, brushedSteelMat, [0, 1.35, 0], [0, 0, Math.PI / 2]);

      // Side extenders with swivel rings
      for (let side of [-1.3, 1.3]) {
        addCylinder(productGroup, 0.02, 0.02, 0.35, champagneGoldMat, [side, 2.35, 0.15], [0.4, 0, 0]);
      }
    }
    else if (productId === 'hanger_6') {
      // 6. Foldable Space-Saving Hanger (Vertical concertina tower)
      camera.position.set(0, 2.6, 6.2);
      camera.lookAt(0, 1.25, 0);

      // 4 Tier vertical concertina scissor frame
      const tiers = 4;
      const heightStep = 0.55;
      for (let t = 0; t < tiers; t++) {
        const y = 0.35 + t * heightStep;
        // Scissor X struts on both sides
        for (let side of [-0.85, 0.85]) {
          addBox(productGroup, 0.03, 0.05, 0.65, oakWoodMat, [side, y + 0.25, 0], [0.55, 0, 0]);
          addBox(productGroup, 0.03, 0.05, 0.65, oakWoodMat, [side, y + 0.25, 0], [-0.55, 0, 0]);
          // Pivot brass studs
          addCylinder(productGroup, 0.015, 0.015, 0.05, brassMat, [side + (side > 0 ? 0.02 : -0.02), y + 0.25, 0], [0, 0, Math.PI / 2]);
        }
        // 4 rungs per tier
        for (let r = 0; r < 4; r++) {
          const rz = -0.24 + r * 0.16;
          addCylinder(productGroup, 0.014, 0.014, 1.68, chromeMat, [0, y, rz], [0, 0, Math.PI / 2]);
        }
      }
      // Top drying rack platform
      for (let r = 0; r < 5; r++) {
        addCylinder(productGroup, 0.014, 0.014, 1.68, chromeMat, [0, 2.5, -0.28 + r * 0.14], [0, 0, Math.PI / 2]);
      }
    }
    else if (productId === 'hanger_7') {
      // 7. Stainless Steel Hanging Rack (Wall mounted shelf with sliding hooks)
      camera.position.set(0, 2.2, 5.8);
      camera.lookAt(0, 1.2, 0);

      // Back wall
      addBox(productGroup, 3.8, 2.6, 0.08, whitePowderMat, [0, 1.4, -0.8]);

      // 2 Brushed heavy-gauge wall standoff brackets
      for (let side of [-1.15, 1.15]) {
        addBox(productGroup, 0.05, 0.45, 0.45, brushedSteelMat, [side, 1.35, -0.55]);
        // Wall plate
        addBox(productGroup, 0.1, 0.55, 0.02, brushedSteelMat, [side, 1.35, -0.76]);
      }

      // Upper towel rack shelf (5 parallel stainless tubes)
      for (let s = 0; s < 5; s++) {
        addCylinder(productGroup, 0.016, 0.016, 2.45, chromeMat, [0, 1.55, -0.7 + s * 0.09], [0, 0, Math.PI / 2]);
      }

      // Lower hanging rail
      addCylinder(productGroup, 0.022, 0.022, 2.45, chromeMat, [0, 1.15, -0.35], [0, 0, Math.PI / 2]);

      // 8 sliding S-hooks
      for (let h = 0; h < 8; h++) {
        const hx = -0.95 + h * 0.27;
        addCylinder(productGroup, 0.008, 0.008, 0.14, champagneGoldMat, [hx, 1.05, -0.35]);
        addCylinder(productGroup, 0.015, 0.015, 0.03, champagneGoldMat, [hx, 0.98, -0.35]);
      }
    }
    else if (productId === 'hanger_8') {
      // 8. Multi-Purpose Clothes Hanger Stand (Modern tree coat rack)
      camera.position.set(0, 2.4, 6.0);
      camera.lookAt(0, 1.3, 0);

      // Heavy marble/granite circular base
      addCylinder(productGroup, 0.55, 0.55, 0.08, whitePowderMat, [0, 0.04, 0]);
      // Gold trim ring around base
      addCylinder(productGroup, 0.56, 0.56, 0.03, champagneGoldMat, [0, 0.04, 0]);

      // Central vertical pole
      addCylinder(productGroup, 0.04, 0.04, 2.4, matteBlackMat, [0, 1.25, 0]);
      // Top gold finial
      addCylinder(productGroup, 0.05, 0.02, 0.12, champagneGoldMat, [0, 2.5, 0]);

      // 8 staggered branches with gold ball tips
      const branchAngles = [0, 1.2, 2.4, 3.6, 4.8, 0.6, 1.8, 3.0];
      const branchHeights = [0.85, 1.1, 1.35, 1.6, 1.85, 2.05, 2.2, 2.35];
      for (let i = 0; i < 8; i++) {
        const ang = branchAngles[i];
        const bh = branchHeights[i];
        const rLen = 0.28;
        const bx = Math.cos(ang) * (rLen / 2 + 0.02);
        const bz = Math.sin(ang) * (rLen / 2 + 0.02);
        // Angled peg
        addCylinder(productGroup, 0.016, 0.016, rLen, oakWoodMat, [bx, bh, bz], [Math.sin(ang) * 0.5, 0, -Math.cos(ang) * 0.5]);
        // Ball tip
        addCylinder(productGroup, 0.03, 0.03, 0.04, champagneGoldMat, [Math.cos(ang) * (rLen + 0.03), bh + 0.08, Math.sin(ang) * (rLen + 0.03)]);
      }
    }
    else if (productId === 'hanger_9') {
      // 9. Premium Extendable Clothes Drying Rack (Lateral sliding pullout)
      camera.position.set(0, 2.5, 6.2);
      camera.lookAt(0, 1.2, 0);

      // Sturdy 4-legged folding frame
      for (let x of [-1.0, 1.0]) {
        addCylinder(productGroup, 0.028, 0.028, 1.7, matteBlackMat, [x, 0.8, -0.35], [0.25, 0, 0]);
        addCylinder(productGroup, 0.028, 0.028, 1.7, matteBlackMat, [x, 0.8, 0.35], [-0.25, 0, 0]);
        addCylinder(productGroup, 0.038, 0.038, 0.06, rubberMat, [x, 0.03, -0.52]);
        addCylinder(productGroup, 0.038, 0.038, 0.06, rubberMat, [x, 0.03, 0.52]);
      }

      // Middle main frame
      addBox(productGroup, 2.1, 0.05, 0.05, matteBlackMat, [0, 1.5, -0.38]);
      addBox(productGroup, 2.1, 0.05, 0.05, matteBlackMat, [0, 1.5, 0.38]);

      // Center fixed rods
      for (let r = 0; r < 6; r++) {
        addCylinder(productGroup, 0.012, 0.012, 2.05, chromeMat, [0, 1.5, -0.3 + r * 0.12], [0, 0, Math.PI / 2]);
      }

      // Lateral extended telescopic arms sliding out on both left & right
      for (let side of [-1.0, 1.0]) {
        const extX = side * 1.35;
        addBox(productGroup, 0.65, 0.03, 0.65, champagneGoldMat, [extX, 1.52, 0]);
        for (let er = 0; er < 4; er++) {
          addCylinder(productGroup, 0.01, 0.01, 0.6, chromeMat, [extX, 1.53, -0.22 + er * 0.15], [0, 0, Math.PI / 2]);
        }
      }
    }
    else if (productId === 'hanger_10') {
      // 10. Deluxe Freestanding Garment Hanger (Double A-frame Valet)
      camera.position.set(0, 2.6, 6.2);
      camera.lookAt(0, 1.3, 0);

      // Solid Scandinavian oak A-frame side supports
      for (let side of [-1.05, 1.05]) {
        addBox(productGroup, 0.06, 2.4, 0.05, oakWoodMat, [side, 1.2, -0.25], [0.22, 0, 0]);
        addBox(productGroup, 0.06, 2.4, 0.05, oakWoodMat, [side, 1.2, 0.25], [-0.22, 0, 0]);
        // Lower cross brace
        addBox(productGroup, 0.05, 0.05, 0.75, oakWoodMat, [side, 0.35, 0]);
      }

      // Upper primary hanging bar
      addCylinder(productGroup, 0.032, 0.032, 2.4, chromeMat, [0, 2.3, 0], [0, 0, Math.PI / 2]);
      // End cap brass knobs
